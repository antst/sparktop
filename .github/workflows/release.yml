name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build universal release & publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal (arm64 + x86_64)
        run: UNIVERSAL=1 ./build.sh

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/SparkTop.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" dist/SparkTop.app/Contents/Info.plist
          codesign --force --sign - dist/SparkTop.app

      - name: Verify bundle
        run: |
          test -x dist/SparkTop.app/Contents/MacOS/SparkTop
          codesign --verify dist/SparkTop.app
          lipo -archs dist/SparkTop.app/Contents/MacOS/SparkTop

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --keepParent SparkTop.app SparkTop-universal.zip
          shasum -a 256 SparkTop-universal.zip > SparkTop-universal.zip.sha256

      - name: Build iOS app (unsigned ipa)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          brew install xcodegen
          cd ios && xcodegen generate --spec project.yml && cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild -project ios/SparkTopIOS.xcodeproj -scheme SparkTopIOS \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build/ios build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION"
          mkdir -p dist/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/SparkTop.app dist/ipa/Payload/
          cd dist/ipa
          zip -qry "SparkTop-unsigned-$VERSION.ipa" Payload
          shasum -a 256 "SparkTop-unsigned-$VERSION.ipa" > "SparkTop-unsigned-$VERSION.ipa.sha256"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/SparkTop-universal.zip \
            dist/SparkTop-universal.zip.sha256 \
            "dist/ipa/SparkTop-unsigned-$VERSION.ipa" \
            "dist/ipa/SparkTop-unsigned-$VERSION.ipa.sha256" \
            --title "SparkTop $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes
