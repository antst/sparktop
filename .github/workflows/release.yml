name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build universal release & publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal (arm64 + x86_64)
        run: UNIVERSAL=1 ./build.sh

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/SparkTop.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" dist/SparkTop.app/Contents/Info.plist
          codesign --force --sign - dist/SparkTop.app

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --keepParent SparkTop.app SparkTop-universal.zip
          shasum -a 256 SparkTop-universal.zip > SparkTop-universal.zip.sha256

      - name: Smoke test launch
        run: |
          ./dist/SparkTop.app/Contents/MacOS/SparkTop --version 2>/dev/null || true
          # The binary launches headless; just verify it starts and exits cleanly on SIGTERM.
          ./dist/SparkTop.app/Contents/MacOS/SparkTop & APP_PID=$!
          sleep 2
          kill -TERM $APP_PID
          wait $APP_PID || true
          echo "launch smoke OK"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/SparkTop-universal.zip \
            dist/SparkTop-universal.zip.sha256 \
            --title "SparkTop $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "### Install

1. Download **SparkTop-universal.zip** and unzip.
2. Move **SparkTop.app** to **/Applications**.
3. First launch: right-click the app → **Open** (ad-hoc signed, so Gatekeeper asks once), or run:

   \`\`\`bash
   xattr -cr /Applications/SparkTop.app
   \`\`\`

4. The ⚡ bolt appears in the menu bar — open Settings (gear) and point it at your sparkDash server (URL + access token).

**Requirements:** macOS 13+. Universal binary (Apple Silicon & Intel).

The app is a thin client for [sparkDash](https://github.com/MiaAI-Lab/sparkDash) — it renders the live fleet snapshot from your own sparkDash server."
