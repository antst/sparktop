name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        run: swift build -c release

      - name: Assemble SparkTop.app (smoke)
        run: ./build.sh

      - name: Verify bundle
        run: |
          test -x dist/SparkTop.app/Contents/MacOS/SparkTop
          test -f dist/SparkTop.app/Contents/Info.plist
          codesign --verify dist/SparkTop.app
          echo "bundle OK"

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (project format needs Xcode 16+)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: cd ios && xcodegen generate --spec project.yml

      - name: Build (unsigned, device)
        run: |
          xcodebuild -project ios/SparkTopIOS.xcodeproj -scheme SparkTopIOS \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build/ios build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Verify bundle
        run: test -d build/ios/Build/Products/Release-iphoneos/SparkTop.app
